<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل الدخول - Afaq Importer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" type="image/png" href="RGB_new4.png" />
    <link rel="stylesheet" href="login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="login-card">
      <div class="login-logo">
        <img src="RGB_new4.png" alt="Afaq Importer company logo" />
        <div class="title">Afaq <span>Importer</span></div>
        <div class="subtitle">تسجيل الدخول للوحة التحكم</div>
        <div
          id="themeToggle"
          class="theme-switch"
          role="switch"
          tabindex="0"
          aria-label="تبديل المظهر"
          aria-checked="false"
        >
          <span class="switch-track" aria-hidden="true">
            <span class="switch-icon switch-icon--moon" aria-hidden="true"
              >🌙</span
            >
            <span class="switch-icon switch-icon--sun" aria-hidden="true"
              >☀️</span
            >
          </span>
          <span class="switch-thumb" aria-hidden="true"></span>
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            required
          />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="login-btn" id="loginBtn">دخول</button>
      </form>
    </div>

    <script src="theme.js"></script>
    <script>
      const form = document.getElementById("loginForm");
      const errorMsg = document.getElementById("errorMsg");
      // Switch aria/state sync with existing theme.js (keeps localStorage behavior intact)

      const themeToggleEl = document.getElementById("themeToggle");
      const syncSwitchAria = () => {
        if (!themeToggleEl) return;
        const current =
          document.documentElement.getAttribute("data-theme") || "light";
        themeToggleEl.setAttribute(
          "aria-checked",
          current === "dark" ? "true" : "false",
        );
      };

      syncSwitchAria();

      // Keep aria in sync when theme.js updates data-theme
      const observer = new MutationObserver(syncSwitchAria);
      observer.observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });

      // Ensure keyboard toggling works even though theme.js listens to click
      if (themeToggleEl) {
        themeToggleEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            themeToggleEl.click();
          }
        });
      }

      // (theme.js already handles the actual theme toggle + localStorage persistence)

      const loginBtn = document.getElementById("loginBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errorMsg.classList.remove("show");
        loginBtn.disabled = true;
        loginBtn.textContent = "جاري الدخول...";

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password }),
          });
          const data = await res.json();

          if (data.success) {
            window.location.href = "/";
          } else {
            errorMsg.textContent = data.message || "بيانات الدخول غير صحيحة";
            errorMsg.classList.add("show");
            loginBtn.disabled = false;
            loginBtn.textContent = "دخول";
          }
        } catch (err) {
          errorMsg.textContent = "حدث خطأ في الاتصال بالسيرفر";
          errorMsg.classList.add("show");
          loginBtn.disabled = false;
          loginBtn.textContent = "دخول";
        }
      });
    </script>
  </body>
</html>
